<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Testimonials</title>

  <style>
    /* ─── Fonts ─────────────────────────────────────────────── */
    @font-face {
      font-family: 'TT Norms Pro';
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url('https://dl.dropboxusercontent.com/scl/fi/lhxa3jw36yc4z3jykkoki/TTNormsPro-Bold.ttf?rlkey=aznuyw3qataj4s0nmxkg94nwb&st=w35slsti&raw=1') format('truetype');
    }
    @font-face {
      font-family: 'TT Norms Pro';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('https://dl.dropboxusercontent.com/scl/fi/4b5zzmzpzu33gycuekxfg/TTNormsPro-Regular.ttf?rlkey=sd8ozhikcfywlcyybk4jgikg4&st=01fk507l&raw=1') format('truetype');
    }

    /* ─── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'TT Norms Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 400;
      color: #161E2A;
      min-height: 100vh;
    }

    /* ─── Section ────────────────────────────────────────────── */
    .testimonials {
      padding: 90px 24px 100px;
      overflow: hidden;
    }

    /* ─── Header ─────────────────────────────────────────────── */
    .testimonials__header {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 70px;
    }

    .testimonials__header h2 {
      font-family: 'TT Norms Pro', sans-serif;
      font-weight: 700;
      font-size: clamp(34px, 5vw, 54px);
      line-height: 1.14;
      color: #161E2A;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
    }

    .testimonials__header h2 .accent { color: #25cadc; }

    .testimonials__header p {
      font-family: 'TT Norms Pro', sans-serif;
      font-weight: 400;
      font-size: 18px;
      line-height: 1.65;
      color: rgba(22, 30, 42, 0.6);
    }

    /* ─── Carousel wrapper ───────────────────────────────────── */
    .carousel {
      max-width: 1440px;
      margin: 0 auto;
      position: relative;
    }

    /*
      All cards: position:absolute, anchored at left:50% top:50%.
      Stage height accounts for video (315px) + info label (~68px) = ~383px
      + breathing room = 450px.
    */
    .carousel__stage {
      position: relative;
      height: 450px;
      overflow: visible;
    }

    /* ─── Card outer wrapper ─────────────────────────────────── */
    /*
      overflow:visible so the info text below the video is not clipped.
      Transitions animate the whole unit (video + label).
    */
    .carousel__card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 560px;
      /* total height: video (315) + gap (20) + label (68) = 403 */
      cursor: pointer;
      overflow: visible;

      transition:
        transform  0.65s cubic-bezier(0.4, 0, 0.2, 1),
        opacity    0.65s cubic-bezier(0.4, 0, 0.2, 1),
        filter     0.65s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform, opacity;
    }

    /* ─── Video box (clipped) ────────────────────────────────── */
    .carousel__card__video {
      width: 100%;
      height: 315px;
      border-radius: 18px;
      overflow: hidden;
      background: #161E2A;
      position: relative;
      transition: box-shadow 0.65s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .carousel__card__video iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Overlay: stops side-card iframes eating clicks */
    .carousel__card__overlay {
      position: absolute;
      inset: 0;
    }

    /* ─── Per-card info label ────────────────────────────────── */
    .carousel__card__info {
      text-align: center;
      padding-top: 20px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.4s ease 0.15s, transform 0.4s ease 0.15s;
      pointer-events: none;
    }

    .carousel__card__info .info-name {
      font-family: 'TT Norms Pro', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #161E2A;
      margin-bottom: 4px;
    }

    .carousel__card__info .info-role {
      font-family: 'TT Norms Pro', sans-serif;
      font-weight: 400;
      font-size: 15px;
      color: #25cadc;
      letter-spacing: 0.2px;
    }

    /*
      Offset math:
        active half-width  = 560/2 = 280 px
        side visual width  = 560 × 0.70 = 392 px → half = 196 px
        gap between cards  = 28 px
        total X offset     = 280 + 196 + 28 = 504 px

      Vertical: cards anchor at top:50%, translate(-50%, -50%)
      so the card center is at stage center. Stage is 450px tall.
    */

    /* Centre (active) */
    .carousel__card--active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      z-index: 3;
      filter: brightness(1);
      cursor: default;
    }
    .carousel__card--active .carousel__card__video {
      box-shadow:
        0 0 0 2.5px #25cadc,
        0 0 40px rgba(37, 202, 220, 0.22),
        0 24px 64px rgba(0, 0, 0, 0.13);
    }
    .carousel__card--active .carousel__card__overlay { display: none; }
    .carousel__card--active .carousel__card__info {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* Left (prev) */
    .carousel__card--prev {
      transform: translate(calc(-50% - 504px), -50%) scale(0.70);
      opacity: 0.72;
      z-index: 2;
      filter: brightness(0.65) saturate(0.75);
    }
    .carousel__card--prev .carousel__card__video {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    /* Right (next) */
    .carousel__card--next {
      transform: translate(calc(-50% + 504px), -50%) scale(0.70);
      opacity: 0.72;
      z-index: 2;
      filter: brightness(0.65) saturate(0.75);
    }
    .carousel__card--next .carousel__card__video {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    /* Off-screen left */
    .carousel__card--hidden-left {
      transform: translate(calc(-50% - 860px), -50%) scale(0.55);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      filter: brightness(0.4);
    }

    /* Off-screen right */
    .carousel__card--hidden-right {
      transform: translate(calc(-50% + 860px), -50%) scale(0.55);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      filter: brightness(0.4);
    }

    /* ─── Navigation ─────────────────────────────────────────── */
    .carousel__nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-top: 42px;
    }

    .carousel__btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #25cadc;
      background: transparent;
      color: #25cadc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.25s ease, color 0.25s ease,
                  transform 0.25s ease, box-shadow 0.25s ease;
    }

    .carousel__btn:hover {
      background: #25cadc;
      color: #ffffff;
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(37, 202, 220, 0.38);
    }

    .carousel__btn:active { transform: scale(0.97); }

    /* Stroke-based SVG chevrons — reliable across all browsers */
    .carousel__btn svg {
      width: 20px;
      height: 20px;
      display: block;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Dots */
    .carousel__dots {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .carousel__dot {
      width: 9px;
      height: 9px;
      border-radius: 5px;
      background: #161E2A;
      opacity: 0.22;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: width 0.3s ease, background 0.3s ease, opacity 0.3s ease;
    }

    .carousel__dot--active {
      width: 30px;
      background: #25cadc;
      opacity: 1;
    }

    /* ─── Mobile ─────────────────────────────────────────────── */
    @media (max-width: 960px) {
      .testimonials {
        padding: 64px 20px 80px;
      }

      .testimonials__header {
        margin-bottom: 44px;
      }

      .carousel__stage {
        height: auto;
        overflow: visible;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }

      /* Reset absolute positioning, hide all cards */
      .carousel__card {
        position: relative;
        top: auto;
        left: auto;
        transform: none !important;
        display: none;
        opacity: 1 !important;
        filter: none !important;
        width: min(480px, 92vw);
      }

      .carousel__card--active {
        display: block;
      }

      .carousel__card--active .carousel__card__video {
        height: calc(min(480px, 92vw) * (9/16));
        border-radius: 14px;
        box-shadow: 0 0 0 2.5px #25cadc, 0 12px 40px rgba(37, 202, 220, 0.18) !important;
      }

      /* Info is always visible on mobile (only active shown anyway) */
      .carousel__card--active .carousel__card__info {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .testimonials__header h2 { font-size: clamp(26px, 8vw, 34px); }
      .testimonials__header p  { font-size: 16px; }
      .carousel__btn { width: 44px; height: 44px; }
    }
  </style>
</head>
<body>

<section class="testimonials">

  <!-- Header -->
  <div class="testimonials__header">
    <h2>Don't take our <span class="accent">word</span> for it.</h2>
    <p>Hear directly from the people who have experienced our work firsthand.</p>
  </div>

  <!-- Carousel -->
  <div class="carousel" id="carousel">

    <div class="carousel__stage" id="stage"></div>

    <!-- Prev / dots / next -->
    <div class="carousel__nav">
      <button class="carousel__btn" id="prevBtn" aria-label="Previous slide">
        <!-- Left chevron (stroke-based) -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>

      <div class="carousel__dots" id="dots" role="tablist" aria-label="Slide indicators"></div>

      <button class="carousel__btn" id="nextBtn" aria-label="Next slide">
        <!-- Right chevron (stroke-based) -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>

  </div><!-- /carousel -->

</section>

<script>
  /*
   * ─── Testimonial data ─────────────────────────────────────────
   * Replace `videoId` with your actual YouTube video IDs.
   */
  const SLIDES = [
    { videoId: 'dQw4w9WgXcQ', name: 'Sarah Johnson',   role: 'CEO, TechCorp'              },
    { videoId: 'jNQXAC9IVRw', name: 'Michael Chen',     role: 'Founder, StartupXYZ'        },
    { videoId: 'M7lc1UVf-VE', name: 'Emily Rodriguez',  role: 'Marketing Director, BrandCo'},
    { videoId: 'ScMzIvxBSi4', name: 'David Kim',        role: 'VP Product, InnovateTech'   },
    { videoId: 'kJQP7kiw5Fk', name: 'Amanda Foster',    role: 'COO, ScaleUp Inc.'          },
  ];

  const N       = SLIDES.length;
  let   current = 0;

  const stage   = document.getElementById('stage');
  const dotsEl  = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  /* ─── Build all cards once ────────────────────────────────────── */
  const cards = SLIDES.map((slide, i) => {
    /* Outer card */
    const card = document.createElement('div');
    card.className = 'carousel__card';
    card.dataset.idx = i;

    /* Video box */
    const videoBox = document.createElement('div');
    videoBox.className = 'carousel__card__video';

    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${slide.videoId}?enablejsapi=1&rel=0&modestbranding=1`;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.setAttribute('allowfullscreen', '');
    iframe.loading = 'lazy';
    iframe.title = `Testimonial from ${slide.name}`;

    const overlay = document.createElement('div');
    overlay.className = 'carousel__card__overlay';

    videoBox.appendChild(iframe);
    videoBox.appendChild(overlay);

    /* Info label (shown only when active via CSS) */
    const info = document.createElement('div');
    info.className = 'carousel__card__info';
    info.innerHTML = `
      <p class="info-name">${slide.name}</p>
      <p class="info-role">${slide.role}</p>
    `;

    card.appendChild(videoBox);
    card.appendChild(info);

    /* Click side card → navigate to it */
    card.addEventListener('click', () => {
      if (Number(card.dataset.idx) !== current) goTo(Number(card.dataset.idx));
    });

    stage.appendChild(card);
    return card;
  });

  /* ─── Dots ────────────────────────────────────────────────────── */
  const dots = SLIDES.map((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'carousel__dot';
    dot.setAttribute('role', 'tab');
    dot.setAttribute('aria-label', `Slide ${i + 1}`);
    dot.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(dot);
    return dot;
  });

  const mod = (n, m) => ((n % m) + m) % m;

  /* ─── Render ──────────────────────────────────────────────────── */
  function render() {
    const prev = mod(current - 1, N);
    const next = mod(current + 1, N);

    cards.forEach((card, i) => {
      const diff = mod(i - current, N);
      card.className = 'carousel__card';

      if      (i === current) card.classList.add('carousel__card--active');
      else if (i === prev)    card.classList.add('carousel__card--prev');
      else if (i === next)    card.classList.add('carousel__card--next');
      else card.classList.add(
        diff < N / 2 ? 'carousel__card--hidden-right' : 'carousel__card--hidden-left'
      );
    });

    dots.forEach((d, i) => {
      d.classList.toggle('carousel__dot--active', i === current);
      d.setAttribute('aria-selected', String(i === current));
    });
  }

  function goTo(idx) { current = mod(idx, N); render(); }

  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  goTo(current - 1);
    if (e.key === 'ArrowRight') goTo(current + 1);
  });

  let touchX = 0;
  stage.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 48) dx < 0 ? goTo(current + 1) : goTo(current - 1);
  }, { passive: true });

  render();
</script>

</body>
</html>
