<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Testimonials</title>

  <style>
    /* ─── Fonts ─────────────────────────────────────────────── */
    @font-face {
      font-family: 'TT Norms Pro';
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url('https://dl.dropboxusercontent.com/scl/fi/lhxa3jw36yc4z3jykkoki/TTNormsPro-Bold.ttf?rlkey=aznuyw3qataj4s0nmxkg94nwb&st=w35slsti&raw=1') format('truetype');
    }
    @font-face {
      font-family: 'TT Norms Pro';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('https://dl.dropboxusercontent.com/scl/fi/4b5zzmzpzu33gycuekxfg/TTNormsPro-Regular.ttf?rlkey=sd8ozhikcfywlcyybk4jgikg4&st=01fk507l&raw=1') format('truetype');
    }

    /* ─── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'TT Norms Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 400;
      background: #F3F4F6;
      color: #161E2A;
      min-height: 100vh;
    }

    /* ─── Section ────────────────────────────────────────────── */
    .testimonials {
      background: #ffffff;
      padding: 90px 24px 100px;
      overflow: hidden;
    }

    /* ─── Header ─────────────────────────────────────────────── */
    .testimonials__header {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 70px;
    }

    .testimonials__header h2 {
      font-family: 'TT Norms Pro', sans-serif;
      font-weight: 700;
      font-size: clamp(34px, 5vw, 54px);
      line-height: 1.14;
      color: #161E2A;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
    }

    .testimonials__header h2 .accent {
      color: #25cadc;
    }

    .testimonials__header p {
      font-family: 'TT Norms Pro', sans-serif;
      font-weight: 400;
      font-size: 18px;
      line-height: 1.65;
      color: rgba(22, 30, 42, 0.6);
    }

    /* ─── Carousel wrapper ───────────────────────────────────── */
    .carousel {
      max-width: 1440px;
      margin: 0 auto;
      position: relative;
    }

    /*
      Stage: position: relative container.
      All cards are position:absolute, centred at left:50% top:50%.
      CSS transitions animate everything smoothly.
    */
    .carousel__stage {
      position: relative;
      /* height accommodates the active card (315px) + vertical breathing room */
      height: 380px;
      /* allow side cards to bleed outside */
      overflow: visible;
    }

    /* ─── Individual card ────────────────────────────────────── */
    .carousel__card {
      position: absolute;
      /* anchor point = top-left, then translate to centre */
      top: 50%;
      left: 50%;
      /* base size; scale() changes visual size without reflow */
      width: 560px;
      height: 315px;
      border-radius: 18px;
      overflow: hidden;
      background: #161E2A;
      cursor: pointer;

      /* All animated props */
      transition:
        transform   0.65s cubic-bezier(0.4, 0, 0.2, 1),
        opacity     0.65s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow  0.65s cubic-bezier(0.4, 0, 0.2, 1),
        filter      0.65s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform, opacity;
    }

    /*
      Offset math:
        active half-width  = 560/2 = 280 px
        side visual width  = 560 × 0.70 = 392 px → half = 196 px
        gap between cards  = 28 px
        total offset       = 280 + 196 + 28 = 504 px
    */

    /* Centre (active) */
    .carousel__card--active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      z-index: 3;
      filter: brightness(1);
      box-shadow:
        0 0 0 2.5px #25cadc,
        0 0 40px rgba(37, 202, 220, 0.22),
        0 24px 64px rgba(0, 0, 0, 0.13);
      cursor: default;
    }

    /* Left (prev) */
    .carousel__card--prev {
      transform: translate(calc(-50% - 504px), -50%) scale(0.70);
      opacity: 0.72;
      z-index: 2;
      filter: brightness(0.65) saturate(0.75);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    /* Right (next) */
    .carousel__card--next {
      transform: translate(calc(-50% + 504px), -50%) scale(0.70);
      opacity: 0.72;
      z-index: 2;
      filter: brightness(0.65) saturate(0.75);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    /* Off-screen left */
    .carousel__card--hidden-left {
      transform: translate(calc(-50% - 860px), -50%) scale(0.55);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      filter: brightness(0.4);
    }

    /* Off-screen right */
    .carousel__card--hidden-right {
      transform: translate(calc(-50% + 860px), -50%) scale(0.55);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      filter: brightness(0.4);
    }

    /* iframe fills card */
    .carousel__card iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Overlay prevents side-card iframes from eating clicks */
    .carousel__card__overlay {
      position: absolute;
      inset: 0;
      background: transparent;
    }
    .carousel__card--active .carousel__card__overlay {
      display: none;
    }

    /* ─── Info (name / role) ─────────────────────────────────── */
    .carousel__info {
      text-align: center;
      padding-top: 36px;
      min-height: 76px;
    }

    .carousel__info__name {
      font-family: 'TT Norms Pro', sans-serif;
      font-weight: 700;
      font-size: 21px;
      color: #161E2A;
      margin-bottom: 5px;
      transition: opacity 0.35s ease;
    }

    .carousel__info__role {
      font-family: 'TT Norms Pro', sans-serif;
      font-weight: 400;
      font-size: 15px;
      color: #25cadc;
      letter-spacing: 0.2px;
      transition: opacity 0.35s ease;
    }

    /* ─── Navigation ─────────────────────────────────────────── */
    .carousel__nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-top: 38px;
    }

    .carousel__btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #25cadc;
      background: #ffffff;
      color: #25cadc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .carousel__btn:hover {
      background: #25cadc;
      color: #ffffff;
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(37, 202, 220, 0.38);
    }

    .carousel__btn:active {
      transform: scale(0.97);
    }

    .carousel__btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      display: block;
    }

    /* Dots */
    .carousel__dots {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .carousel__dot {
      width: 9px;
      height: 9px;
      border-radius: 5px;
      background: #161E2A;
      opacity: 0.22;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: width 0.3s ease, background 0.3s ease, opacity 0.3s ease;
    }

    .carousel__dot--active {
      width: 30px;
      background: #25cadc;
      opacity: 1;
    }

    /* ─── Mobile ─────────────────────────────────────────────── */
    @media (max-width: 960px) {
      .testimonials {
        padding: 64px 20px 80px;
      }

      .testimonials__header {
        margin-bottom: 44px;
      }

      /* Stack into normal flow on mobile */
      .carousel__stage {
        height: auto;
        overflow: visible;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* All cards: reset absolute positioning */
      .carousel__card {
        position: relative;
        top: auto;
        left: auto;
        /* Override all transform states */
        transform: none !important;
        display: none;
        opacity: 1 !important;
        filter: none !important;
        box-shadow: 0 0 0 2.5px #25cadc, 0 12px 40px rgba(37, 202, 220, 0.18) !important;
      }

      .carousel__card--active {
        display: block;
        width: min(480px, 92vw);
        height: calc(min(480px, 92vw) * (9/16));
        border-radius: 14px;
      }

      .carousel__card--active .carousel__card__overlay {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .testimonials__header h2 {
        font-size: clamp(26px, 8vw, 34px);
      }
      .testimonials__header p {
        font-size: 16px;
      }
      .carousel__btn {
        width: 44px;
        height: 44px;
      }
      .carousel__info__name {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

<section class="testimonials">

  <!-- Header -->
  <div class="testimonials__header">
    <h2>Don't take our <span class="accent">word</span> for it.</h2>
    <p>Hear directly from the people who have experienced our work firsthand.</p>
  </div>

  <!-- Carousel -->
  <div class="carousel" id="carousel">

    <div class="carousel__stage" id="stage"></div>

    <!-- Name / role display -->
    <div class="carousel__info">
      <div class="carousel__info__name" id="infoName"></div>
      <div class="carousel__info__role" id="infoRole"></div>
    </div>

    <!-- Prev / dots / next -->
    <div class="carousel__nav">
      <button class="carousel__btn" id="prevBtn" aria-label="Previous slide">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/>
        </svg>
      </button>

      <div class="carousel__dots" id="dots" role="tablist" aria-label="Slide indicators"></div>

      <button class="carousel__btn" id="nextBtn" aria-label="Next slide">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/>
        </svg>
      </button>
    </div>

  </div><!-- /carousel -->

</section>

<script>
  /*
   * ─── Testimonial data ─────────────────────────────────────────
   * Replace `videoId` values with your actual YouTube video IDs.
   * Each entry can also use a Vimeo embed URL or any iframe src.
   */
  const SLIDES = [
    {
      videoId: 'dQw4w9WgXcQ',   // ← replace with your YouTube video ID
      name:    'Sarah Johnson',
      role:    'CEO, TechCorp',
    },
    {
      videoId: 'jNQXAC9IVRw',   // ← replace with your YouTube video ID
      name:    'Michael Chen',
      role:    'Founder, StartupXYZ',
    },
    {
      videoId: 'M7lc1UVf-VE',   // ← replace with your YouTube video ID
      name:    'Emily Rodriguez',
      role:    'Marketing Director, BrandCo',
    },
    {
      videoId: 'ScMzIvxBSi4',   // ← replace with your YouTube video ID
      name:    'David Kim',
      role:    'VP Product, InnovateTech',
    },
    {
      videoId: 'kJQP7kiw5Fk',   // ← replace with your YouTube video ID
      name:    'Amanda Foster',
      role:    'COO, ScaleUp Inc.',
    },
  ];

  /* ─── State ───────────────────────────────────────────────────── */
  const N       = SLIDES.length;
  let   current = 0;

  const stage   = document.getElementById('stage');
  const dotsEl  = document.getElementById('dots');
  const nameEl  = document.getElementById('infoName');
  const roleEl  = document.getElementById('infoRole');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  /* ─── Build DOM once ──────────────────────────────────────────── */
  const cards = SLIDES.map((slide, i) => {
    const card = document.createElement('div');
    card.className = 'carousel__card';
    card.dataset.idx = i;

    /* YouTube embed — autoplay disabled; enablejsapi for future pause API */
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${slide.videoId}?enablejsapi=1&rel=0&modestbranding=1`;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.setAttribute('allowfullscreen', '');
    iframe.loading = 'lazy';
    iframe.title = `Testimonial from ${slide.name}`;

    /* Overlay: blocks iframe pointer events on non-active cards */
    const overlay = document.createElement('div');
    overlay.className = 'carousel__card__overlay';

    card.appendChild(iframe);
    card.appendChild(overlay);

    /* Click on a side card → navigate to it */
    card.addEventListener('click', () => {
      if (Number(card.dataset.idx) !== current) goTo(Number(card.dataset.idx));
    });

    stage.appendChild(card);
    return card;
  });

  /* ─── Build dots ──────────────────────────────────────────────── */
  const dots = SLIDES.map((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'carousel__dot';
    dot.setAttribute('role', 'tab');
    dot.setAttribute('aria-label', `Slide ${i + 1}`);
    dot.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(dot);
    return dot;
  });

  /* ─── Helper: modulo that handles negatives ───────────────────── */
  const mod = (n, m) => ((n % m) + m) % m;

  /* ─── Update visual state ─────────────────────────────────────── */
  function render() {
    const prev = mod(current - 1, N);
    const next = mod(current + 1, N);

    cards.forEach((card, i) => {
      const diff = mod(i - current, N);

      card.className = 'carousel__card'; // reset

      if (i === current) {
        card.classList.add('carousel__card--active');
      } else if (i === prev) {
        card.classList.add('carousel__card--prev');
      } else if (i === next) {
        card.classList.add('carousel__card--next');
      } else {
        /* hidden: place on the nearest side so the transition goes the right way */
        card.classList.add(diff < N / 2 ? 'carousel__card--hidden-right' : 'carousel__card--hidden-left');
      }
    });

    /* Fade info text out then in */
    nameEl.style.opacity = '0';
    roleEl.style.opacity = '0';
    setTimeout(() => {
      nameEl.textContent = SLIDES[current].name;
      roleEl.textContent = SLIDES[current].role;
      nameEl.style.opacity = '1';
      roleEl.style.opacity = '1';
    }, 220);

    /* Dots */
    dots.forEach((d, i) => {
      d.classList.toggle('carousel__dot--active', i === current);
      d.setAttribute('aria-selected', i === current);
    });
  }

  /* ─── Navigate ────────────────────────────────────────────────── */
  function goTo(idx) {
    current = mod(idx, N);
    render();
  }

  /* ─── Controls ────────────────────────────────────────────────── */
  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));

  /* ─── Keyboard ────────────────────────────────────────────────── */
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  goTo(current - 1);
    if (e.key === 'ArrowRight') goTo(current + 1);
  });

  /* ─── Touch / swipe ───────────────────────────────────────────── */
  let touchX = 0;
  stage.addEventListener('touchstart', e => {
    touchX = e.touches[0].clientX;
  }, { passive: true });
  stage.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 48) dx < 0 ? goTo(current + 1) : goTo(current - 1);
  }, { passive: true });

  /* ─── Auto-advance (optional — uncomment to enable) ─────────────
  let autoTimer = setInterval(() => goTo(current + 1), 6000);
  document.getElementById('carousel').addEventListener('mouseenter', () => clearInterval(autoTimer));
  document.getElementById('carousel').addEventListener('mouseleave', () => {
    autoTimer = setInterval(() => goTo(current + 1), 6000);
  });
  ─────────────────────────────────────────────────────────────── */

  /* ─── Init ────────────────────────────────────────────────────── */
  render();
</script>

</body>
</html>
